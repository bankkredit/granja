<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🐖 Granja Porcina - Sistema de Gestión</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    
    <!-- Estilos propios -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ===== BARRA SUPERIOR ===== -->
    <header id="topbar">
        <button id="menuToggle" aria-label="Toggle menu" class="menu-btn">
            <i class="fas fa-bars"></i>
        </button>
        
        <div class="topbar-brand">
            <span class="brand-icon">🐖</span>
            <span class="brand-name">Granja Porcina</span>
        </div>
        
        <div class="topbar-center">
            <h1 id="pageTitle">Dashboard</h1>
        </div>
        
        <div class="topbar-right">
            <div class="topbar-user">
                <span class="user-avatar" id="userAvatar">
                    <i class="fas fa-user"></i>
                </span>
                <span id="userInfo" class="user-name">Usuario</span>
            </div>
            <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
            <button id="logoutBtn" class="btn btn-outline btn-sm">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </header>

    <!-- ===== MENÚ LATERAL ===== -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <span class="logo-icon">🐖</span>
                <span class="logo-text">Granja</span>
            </div>
        </div>
        
        <ul class="menu">
            <li data-view="dashboard" class="active">
                <i class="fas fa-th-large"></i>
                <span>Dashboard</span>
                <span class="menu-badge"></span>
            </li>
            <li data-view="animales">
                <i class="fas fa-paw"></i>
                <span>Animales</span>
                <span class="menu-badge" id="badgeAnimales">0</span>
            </li>
            <li data-view="eventos">
                <i class="fas fa-calendar-plus"></i>
                <span>Eventos</span>
                <span class="menu-badge" id="badgeEventos">0</span>
            </li>
            <li data-view="reportes">
                <i class="fas fa-chart-bar"></i>
                <span>Reportes</span>
            </li>
            <li data-view="genealogia">
                <i class="fas fa-tree"></i>
                <span>Genealogía</span>
            </li>
            <li data-view="usuarios" id="menuUsuarios">
                <i class="fas fa-users-cog"></i>
                <span>Usuarios</span>
            </li>
            <li data-view="configuracion" id="menuConfig">
                <i class="fas fa-cog"></i>
                <span>Configuración</span>
            </li>
        </ul>
        
        <div class="sidebar-footer">
            <div class="sidebar-status">
                <span class="status-dot online"></span>
                <span class="status-text">Conectado</span>
            </div>
            <div class="sidebar-version">
                <small>v2.0</small>
            </div>
        </div>
    </nav>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <main id="mainContent">
        <!-- ===== DASHBOARD ===== -->
        <section id="view-dashboard" class="view active">
            <div id="dashboardContent"></div>
        </section>

        <!-- ===== ANIMALES ===== -->
        <section id="view-animales" class="view">
            <div id="animalesContent"></div>
        </section>

        <!-- ===== EVENTOS ===== -->
        <section id="view-eventos" class="view">
            <div id="eventosContent"></div>
        </section>

        <!-- ===== REPORTES ===== -->
        <section id="view-reportes" class="view">
            <div id="reportesContent"></div>
        </section>

        <!-- ===== GENEALOGÍA ===== -->
        <section id="view-genealogia" class="view">
            <div id="genealogiaContent"></div>
        </section>

        <!-- ===== USUARIOS ===== -->
        <section id="view-usuarios" class="view">
            <div id="usuariosContent"></div>
        </section>

        <!-- ===== CONFIGURACIÓN ===== -->
        <section id="view-configuracion" class="view">
            <div id="configuracionContent"></div>
        </section>
    </main>

    <!-- ===== MODAL GENÉRICO ===== -->
    <div id="modalOverlay" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Título</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter">
                <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
                <button class="btn btn-primary" id="modalConfirm">Aceptar</button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST NOTIFICATIONS ===== -->
    <div id="toastContainer"></div>

    <!-- ===== SCRIPTS (CDN) ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- ===== MÓDULOS PROPIOS ===== -->
    <script src="js/util.js"></script>
    <script src="js/app.js"></script>
    <script src="js/animales.js"></script>
    <script src="js/eventos.js"></script>
    <script src="js/reportes.js"></script>
    <script src="js/configuracion.js"></script>
    <script src="js/genealogia.js"></script>
</body>
</html>
