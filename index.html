<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Granja Porcina - Sistema de Gestión</title>
    <!-- Font Awesome (íconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- BARRA SUPERIOR -->
    <header id="topbar">
        <button id="menuToggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-right">
            <button id="themeToggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
            <span id="userInfo">Usuario</span>
            <button id="logoutBtn" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> Salir</button>
        </div>
    </header>

    <!-- MENÚ LATERAL -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <h2>🐖 Granja</h2>
        </div>
        <ul class="menu">
            <li data-view="dashboard" class="active"><i class="fas fa-chart-pie"></i> Dashboard</li>
            <li data-view="animales"><i class="fas fa-paw"></i> Animales</li>
            <li data-view="eventos"><i class="fas fa-calendar-plus"></i> Eventos</li>
            <li data-view="reportes"><i class="fas fa-file-alt"></i> Reportes</li>
            <li data-view="configuracion" id="menuConfig"><i class="fas fa-cog"></i> Configuración</li>
        </ul>
        <div class="sidebar-footer">
            <small>v1.0</small>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="mainContent">
        <!-- Cada vista es un div con clase "view" -->
        <section id="view-dashboard" class="view active">
            <div id="dashboardContent">
                <!-- Dashboard se carga dinámicamente -->
            </div>
        </section>
        <section id="view-animales" class="view">
            <div id="animalesContent">
                <!-- Listado y gestión de animales -->
            </div>
        </section>
        <section id="view-eventos" class="view">
            <div id="eventosContent">
                <!-- Registro de eventos -->
            </div>
        </section>
        <section id="view-reportes" class="view">
            <div id="reportesContent">
                <!-- Reportes y gráficas -->
            </div>
        </section>
        <section id="view-configuracion" class="view">
            <div id="configuracionContent">
                <!-- Configuración de listas -->
            </div>
        </section>
    </main>

    <!-- MODAL GENÉRICO -->
    <div id="modalOverlay" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Título</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Contenido dinámico -->
            </div>
            <div class="modal-footer" id="modalFooter">
                <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
                <button class="btn btn-primary" id="modalConfirm">Aceptar</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toastContainer"></div>

    <!-- SCRIPTS (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Módulos propios (ORDEN CORRECTO) -->
    <script src="js/util.js"></script>
    <script src="js/app.js"></script>
    <script src="js/animales.js"></script>
    <script src="js/eventos.js"></script>
</body>
</html>
